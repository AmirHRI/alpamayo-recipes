# Stage 2 action-expert training on the OFFICIAL LCDrive train split (UUID-filtered).
#
# Mirrors sft_stage2_cosmos2b.yaml but:
#   - restricts train/val to the LCDrive manifest UUID lists (interleaved across chunks)
#   - points the frozen VLM at the LCDrive-trained Stage 1 checkpoint
#   - writes to a separate output_dir
defaults:
  - sft_base
  - /models/cosmos_reason2_2b_expert@model
  - /wandb: cosmos2b_stage2
  - _self_

model:
  # Use the VLM fine-tuned on the LCDrive split (update the checkpoint id once Stage 1 finishes)
  stage1_vlm_checkpoint_path: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_sft/training/output_stage1_cosmos2b_lcdrive/checkpoint-3000

data:
  train_dataset:
    chunk_ids: "0-3146"     # scan all present chunks; UUID filter does the selection
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
  val_dataset:
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_clip_uuids.txt

trainer:
  report_to: wandb
  # VLM is frozen so no gradient checkpointing or ZeRO needed
  gradient_checkpointing: false
  deepspeed: null
  ddp_find_unused_parameters: true
  per_device_train_batch_size: 4   # 1×2×4=8 effective, same as default
  gradient_accumulation_steps: 1
  learning_rate: 1e-4
  warmup_steps: 100
  num_train_epochs: 3

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_sft/training/output_stage2_cosmos2b_lcdrive

evaluate:
  eval_ckpt: null
