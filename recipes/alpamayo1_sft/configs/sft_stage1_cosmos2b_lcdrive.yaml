# Stage 1 VLM fine-tune on the OFFICIAL LCDrive train split (UUID-filtered).
#
# LCDrive train = 38,340 clips, LCDrive val = 23,331 clips, both verified to be
# strict subsets of the built-in clip_index `split` column (no train/val leakage).
# The clips are interleaved across chunks 0-3143 (all present on disk), so we scan
# the full chunk range and restrict to the manifest UUID lists via `clip_uuid_filter`.
defaults:
  - sft_base
  - /models/cosmos_reason2_2b@model
  - /wandb: default
  - _self_

data:
  train_dataset:
    chunk_ids: "0-3146"     # scan all present chunks; UUID filter does the selection
    clip_uuid_filter: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
  val_dataset:
    chunk_ids: "0-3146"
    clip_uuid_filter: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_clip_uuids.txt

trainer:
  report_to: wandb
  lr_multiplier:
    vlm.model.visual: 0.1
  ddp_find_unused_parameters: false
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_steps: 500
  num_train_epochs: 3

paths:
  output_dir: /data/achahe/alpamayo-recipes/recipes/alpamayo1_sft/training/output_stage1_cosmos2b_lcdrive

evaluate:
  eval_ckpt: null
