[project]
name = "alpamayo1-5-distill"
version = "0.1.0"
requires-python = "==3.12.*"
# Latent-reasoning distillation reuses the alpamayo1_5_sft student/teacher model
# classes, trainer, and shared config groups, so it depends on that recipe
# directly (path source below) and inherits its exact environment (transformers
# 4.57.1, the Qwen3-VL / Cosmos-Reason2 path). No new heavy dependencies.
dependencies = [
  "alpamayo1_5_sft",
  "alpamayo_r1",
  "alpamayo-recipes",
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "einops>=0.8.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "mediapy>=1.2.4",
  "opencv-python>=4.10.0",
  "pandas>=2.3.3",
  "physical_ai_av>=0.2.0",
  "pillow>=12.0.0",
  "torch==2.8.0",
  "torchvision>=0.23.0",
  "transformers==4.57.1",
  "flash-attn>=2.8.3",
  "rich>=14.3.3",
  "wandb>=0.25.0",
  "torchmetrics==1.8.2",
  "deepspeed==0.19.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Look one level up (recipes/) so setuptools finds alpamayo1_5_distill/ as a
# proper package. The editable install adds recipes/ to sys.path, making both
# `alpamayo1_5_distill` and (its dependency) `alpamayo1_5_sft` importable.
[tool.setuptools.packages.find]
where = [".."]
include = ["alpamayo1_5_distill*"]

[dependency-groups]
dev = [
  "matplotlib>=3.10.7",
  "ipykernel>=6.29.3",
  "pytest>=8.0.0",
  "tqdm",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
override-dependencies = ["deepspeed==0.19.1"]

[tool.uv.sources]
alpamayo1_5_sft = { path = "../alpamayo1_5_sft", editable = true }
alpamayo_r1 = { git = "https://github.com/NVlabs/alpamayo.git" }
alpamayo-recipes = { path = "../../src", editable = true }

[tool.ruff]
line-length = 100
