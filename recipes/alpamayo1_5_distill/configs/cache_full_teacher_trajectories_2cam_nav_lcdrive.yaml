# Offline exact action rollouts from the released full Alpamayo-1.5 model.
#
# The cache builder uses the full 8B VLM and full 36-layer action expert with the
# same two cameras, nav text, t0 anchors, prompt formatting, and 10-step Euler
# sampler used by evaluation.  Per sample it stores K complete action-state paths:
# [noise at s=0, state after step 1, ..., state after step 10 at s=1].
defaults:
  - sft_base
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

model:
  _target_: alpamayo1_5_distill.models.stitched_model.StitchedAlpamayoR1.from_teacher
  checkpoint_path: /data/achahe/alpasim/huggingface/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  teacher_checkpoint_path: /data/achahe/alpasim/huggingface/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  vlm_name_or_path: /data/achahe/alpasim/huggingface/hub/models--nvidia--Cosmos-Reason2-8B/snapshots/a9fae2cf89dc64db96b12860417f0eb403013bb9
  attn_implementation: sdpa

data:
  cache_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    _recursive_: false
    cameras: [1, 3]
    annotations_path: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_train_anchors_50k_turnpreserved.json
    local_dir: /data/datasets/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: true

paths:
  output_dir: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training

task_name: alpamayo_1_5_full_teacher_action_rollout_cache
