# CD / endpoint distillation on the LAYER-MIX EoS model -- the last stage of the chain.
#
#   KD block+span (mix2bnav)  ->  EoS expert-on-student  ->  CD endpoint (here)
#
# Input is output_eos_2b_mix_nav_lcdrive/checkpoint-4168 (2 epochs, the recipe: a third buys
# nothing). That model scores min_ade 1.1223 / ade 2.1045 at NFE=10.
#
# The comparison is the same CD variant on the PRUNED-student chain:
# cd_eos2b_endpoint_gt03_ep2_eos_checkpoint-3126_nfe2 -> min_ade 1.3344 / ade 2.5141 at NFE=2.
#
# ⚠️ EVALUATE AT NFE=2. CD exists to make the 2-step sampler work; scoring it at 10 steps
# measures something the training was not for.

defaults:
  - sft_base
  - /wandb: default
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

model:
  _target_: alpamayo1_5_distill.models.consistency_expert.ConsistencyExpertVLA.from_eos_checkpoint
  eos_checkpoint_path: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_eos_2b_mix_nav_lcdrive/checkpoint-4168
  vlm_name_or_path: /temp/achahe/hf_cache/hub/Cosmos-Reason2-2B
  alpamayo_config_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  cotrain_vlm: false
  stop_grad_from_vlm: true
  cd:
    teacher_source: cached_full
    # Still 10: it is the cache's grid, and it sets which tau values x_hi is drawn from
    # (tau_hi = 1 - s/10, so {0.1 ... 1.0}). It no longer defines a bootstrap chain.
    m_rungs: 10
    # THE CHANGE. cd_weight 0 turns off the bootstrap term AND skips the EMA target
    # forward, so this arm runs ONE expert forward per step instead of two.
    cd_weight: 0.0
    # Endpoint term, unchanged from Arm A: the cached states[k, M] for the SAME noise
    # draw. Now named explicitly rather than via the legacy `x0_source: teacher` shim.
    x0_teacher_weight: 1.0
    # THE DAMPER. Arm A ep2 reached min_ade 1.3429 at 2 NFE (beating the 10-step
    # baseline's 1.3974, z=-2.12) but ade 2.8433 vs 2.4859, because diversity ran to
    # 2.511 against the teacher's 0.892 at the same step count. The GT action is shared
    # by all K draws, so this term pulls the spread back in. Its own barycentre already
    # scores ade 2.3851 -- better than the baseline's 2.4859 -- so the accuracy is in the
    # sample set and only needs concentrating.
    x0_gt_weight: 0.3
    x0_gt_normalizer: 1.0
    x0_source: gt
    metric: mse
    normalizer: 1.0
    student_prune_layers: null
    teacher_num_layers: 36
    # ⚠️ 36, not the default 28: this EoS checkpoint's expert was never pruned. Its cache slots
    # are synthesised from the student's 28 VLM layers by the frozen P below, which is loaded
    # EXPLICITLY -- `_load_modules_from_checkpoint` filters to vlm./expert./action_*/diffusion./
    # action_space. and would drop `layer_mixer.*` silently.
    # ⚠️ These four must match the geometry the checkpoint's layer_mixer.* was saved from.
    layer_mix: true
    layer_mix_blocks: 4
    layer_mix_gain: false
    layer_mix_sharpen: 0.75

data:
  train_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_train_anchors_50k_turnpreserved.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    teacher_trajectory_cache_root: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/teacher_action_rollouts_full10b_2cam_nav_k6_m10
    teacher_trajectory_cached_only: false
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  val_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_val_mysubset_1k.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_mysubset_1k_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  collate_fn:
    include_camera_ids: true
    include_frame_nums: true

trainer:
  report_to: wandb
  ddp_find_unused_parameters: false
  deepspeed: null
  gradient_checkpointing: false
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  dataloader_num_workers: 5   # two runs share 24 cores
  # Unchanged from job 591 on purpose: the objective is the only variable. Adam largely
  # normalises away the 10x larger term weight, so the step size stays comparable.
  learning_rate: 2e-5
  warmup_steps: 200
  num_train_epochs: 2
  save_strategy: epoch
  save_total_limit: 3

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_cd_eos2b_mix_endpoint_gt03_nav_e2

wandb:
  team: zrb20
  project: alpamayo1_5-consistency-distill
  group: cd_eos_student_2b_endpoint_gt03

# ⚠️ NO `callbacks.ema` block, and that is the point. With cd_weight=0 there is no target
# network to build, so an EMA would only burn 7.1 GB and make the saved checkpoint a
# lagging average of the weights that were actually trained. `sft_base` defaults to `{}`.

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_cd_eos2b_endpoint_gt03
run_name: cd_eos2b_endpoint_gt03_${now:%m%d-%H%M}
