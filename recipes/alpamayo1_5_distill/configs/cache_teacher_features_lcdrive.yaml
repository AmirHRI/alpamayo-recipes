# Teacher-feature cache over the official LCDrive TRAIN split (UUID-filtered),
# matching sft_stage1_cosmos2b_lcdrive.yaml's data selection so the cache keys
# (clip_id, DEFAULT_T0_US) line up with the student's training samples.
#
# LCDrive has no route/nav_text and no GT CoT at the default keyframe, so we use
# mode=generate: the teacher GENERATES its own CoT (it was trained to) and stops
# at <traj_future_start>; we cache the reasoning-conditioned hidden there. The
# `distill_teacher_generate` processor puts `cot` LAST so the assistant turn ends
# with <|cot_start|> and the teacher reasons BEFORE the handoff token (a
# traj_future-last prompt would pre-fill <|traj_future_start|> and skip reasoning).
# generation_mode=true so the rollout runs.
#
# Run (sharded across GPUs is recommended; the 10B is ~seconds/sample):
#   python -m alpamayo1_5_distill.scripts.generate_teacher_features \
#       config=cache_teacher_features_lcdrive teacher=teacher_ar1_5_10b \
#       mode=generate out=.../teacher_lcdrive.safetensors
defaults:
  - sft_base
  - /models@model: teacher_ar1_5_10b
  - /vla_processor@data.cache_dataset.vla_preprocess_args: distill_teacher_generate
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

data:
  cache_dataset:
    _target_: alpamayo1_5_distill.data.distill_dataset.DistillPAIDataset
    _recursive_: false
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"     # scan all present chunks; the UUID filter selects LCDrive train
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    use_default_keyframe: true
    teacher_cache_path: null   # building the cache, not reading it
    vla_preprocess_args:
      generation_mode: true

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training
task_name: alpamayo_1_5_distill_cache_lcdrive
