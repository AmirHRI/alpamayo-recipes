# Teacher-side processor for the annotation/nav path: same as `nav` but with
# `cot` in context so the teacher is reasoning-conditioned. Used ONLY for
# offline teacher-feature generation; the student trains CoT-free (uses `nav`).
_target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
chat_template_version: r1_5
components_order: ["image", "traj_history", "route", "prompt", "cot", "traj_future"]
components_prompt: ["traj_future"]
label_components: ["traj_future"]
include_camera_ids: true
include_frame_nums: true
