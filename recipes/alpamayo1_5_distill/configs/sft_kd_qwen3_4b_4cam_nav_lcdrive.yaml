# 4-CAMERA variant of sft_kd_qwen3_4b_2cam_nav_lcdrive.
# Identical in every other respect -- same anchors_all manifest, same nav format, same
# block/span curriculum, same LR schedule. ONLY the camera set changes, [1,3] -> [0,1,2,3].
#
# ⚠️ 16 images per sample, not 8. That doubles the vision tokens, so the 2-camera arm's
# BS=8 does not carry over: the launcher passes BS=4 ACCUM=2 to hold the effective batch
# at 32, which is what keeps warmup_steps=733 and the 3,438 steps/epoch valid.
# ⚠️ Needs the 4-CAMERA cache. FrameCacheNavDataset compares its index's camera list
# against `cameras` and raises on a mismatch, so pairing this with the 2-camera cache
# fails at startup rather than training on the wrong pixels.
# Qwen3-VL-4B student, TWO FRONT CAMERAS + NAV-CONDITIONED.
#
# The 2-camera counterpart of sft_kd_qwen3_4b_nav_lcdrive.yaml, and the 4B counterpart of
# sft_kd_cosmos2b_2cam_nav_lcdrive.yaml. Everything except the camera set is held fixed
# against the 4-camera run (job 20550): same annotations, same loss arm, same effective
# batch, same warmup, same 5 epochs.
#
# ⚠️ CameraSubsetPAIDataset, NOT PAIDatasetWithNav. This is the exact distinction that cost
# job 20550 its comparability: PAIDatasetWithNav is a plain PAIDataset plus nav, so it yields
# ALL FOUR cameras (4 x 4 frames = 16 images). CameraSubsetPAIDataset wraps it -- pass
# `annotations_path` and it constructs PAIDatasetWithNav internally -- and slices the camera
# axis BEFORE preprocessing, so the prompt is rebuilt for the subset. Confirm at startup:
# it prints "[camsubset] N nav samples, cameras [1, 3] (2 x 4 frames = 8 images)". No
# [camsubset] line in the log means the subsetting never happened.
# ⚠️ cameras [1, 3] are indices into the LOADER's camera order (front-wide, front-telephoto),
# NOT the global camera table.
# ⚠️ "route" MUST be in components_order or nav_text is silently discarded: r1_5.py emits the
# route only on `case "route":`. CameraSubsetPAIDataset raises if annotations_path is set and
# "route" is missing, which is the guard that makes a silent nav-less run impossible.
# ⚠️ t0 is per-annotation (event-anchored), so nothing here is comparable to the arms that use
# the default 5.1 s keyframe.
# ⚠️ hydra forbids inheriting a config that declares `hydra.searchpath`, so the whole file is
# restated rather than reused. If you change camera-id / frame-num flags or trainer settings
# in sft_kd_qwen3_4b_nav_lcdrive.yaml, change them here too.
defaults:
  - sft_base
  - /models/qwen3_vl_4b_kd@model
  - /wandb: default
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

data:
  # ⚠️ The teacher's config.json declares include_camera_ids / include_frame_nums TRUE and
  # the reference create_message() prefixes each image with "Front left camera: frame 0 ".
  # Student and teacher must both use the annotated format, or the sequences differ and every
  # position-wise KV target is misaligned.
  train_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [0, 1, 2, 3]    # cross-left, front-wide, cross-right, front-telephoto (loader order)
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_train_anchors_50k_turnpreserved.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  # ⚠️ Camera-subset here TOO, but NOT nav-conditioned -- exactly what
  # sft_kd_cosmos2b_2cam_nav_lcdrive.yaml does. The camera set must match training or the
  # student is scored off-distribution (measured on this very checkpoint: evaluating the
  # 4-camera student through a 2-camera prompt cost +0.2167 min_ade, jobs 20585 vs 20598).
  # The KEYFRAME stays the default 5.1 s so val numbers keep meaning across arms.
  val_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [0, 1, 2, 3]
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: true
  collate_fn:
    include_camera_ids: true
    include_frame_nums: true

trainer:
  report_to: wandb
  # ⚠️ NO lr_multiplier: the ViT trains at the SAME rate as the LLM, matching both the 2B nav
  # run and the 4-camera 4B run this is paired with.
  lr_multiplier: null
  ddp_find_unused_parameters: false

  # ABSOLUTE path. sft_base sets `configs/deepspeed/zero2.json`, which only resolves when
  # cwd is the *sft* recipe dir.
  deepspeed: /home/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/configs/deepspeed/zero2.json

  gradient_checkpointing: true

  per_device_train_batch_size: 1
  gradient_accumulation_steps: 12
  learning_rate: 1e-5
  # ⚠️ warmup is ~21% of ONE EPOCH and is a STEP COUNT, so it moves with the EFFECTIVE batch
  # -- but NOT with how that batch is split across GPUs. 50,000 annotations at effective 32
  # is 1,563 steps/epoch -> 333, whether the split is 4x8x1 or 8x4x1.
  warmup_steps: 333
  num_train_epochs: 5

  # STEP-based saving, matching the 4-camera run so the two are checkpoint-aligned and can be
  # compared at equal step counts, not just at the end.
  save_strategy: steps
  save_steps: 500
  save_total_limit: 10

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_kd_qwen3_4b_2cam_nav_lcdrive

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_kd_qwen3_4b_2cam_nav_lcdrive
run_name: kd_4b_2cam_nav_${now:%m%d-%H%M}

wandb:
  team: zrb20
  project: alpamayo1_5-kd-qwen3-4b
  group: kd_4b_nav_lcdrive_arms
