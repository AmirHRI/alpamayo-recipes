# Consistency distillation of an action expert against a FULL 36-layer frozen teacher.
# TWO CAMERAS (front-wide + front-telephoto) + NAV text on event-anchored t0.
#
# Cuts the sampler from 10 Euler steps to 1-2. Denoising is 51-77% of end-to-end latency and
# 180.7 ms of the teacher's 279.4 ms at 2 cameras, so it is the largest single latency term.
#
# WHAT GATE C ALREADY MEASURED (teacher, 2cam, n=1000, seeded, paired) -- this is the gap:
#
#   steps  latency   min_ade   ade      diversity
#     1    116.8 ms  1.2436    1.6116   0.649     <- where 1 NFE is today
#     2    134.9 ms  0.8876    1.4236   0.860
#    10    279.7 ms  0.7185    1.6736   1.588     <- the ceiling this objective distils toward
#
# At 1 NFE the sampler is BOTH collapsed (spread 0.418 m vs 1.034) and biased (its centroid
# sits 1.0026 m off the 10-step centroid). CD has to fix both. Success = min_ade well below
# 1.2436 and diversity well above 0.649, at 116.8 ms.
#
# ⚠️ `ade` is expected to REGRESS toward the teacher's 1.6736, which is worse than 2-step
# Euler's 1.4236. The objective cannot beat the model it distils, so that is an accepted
# cost of optimising min_ade + diversity. Do not read an ade regression as a bug.
#
# ⚠️ THE GATE C BASELINE DOES NOT APPLY DIRECTLY TO THIS ARM. Those numbers are 2cam but
# NO-NAV and default-t0. This config trains on nav text with event-anchored t0 (one sample
# per annotation, its own t0_relative), so the conditioning distribution differs and Gate E
# needs its own nav-anchored teacher baseline before any comparison is meaningful.
#
# ⚠️ PRUNING IS EXPLICIT. The default arm is full depth and requires the environment to be
# unset. A pruned arm must set BOTH `student_prune_layers` and `PRUNE_EXPERT_LAYERS` to the
# exact same indices; init_cd also verifies those slots were actually replaced. The frozen
# target is constructed separately and asserted to remain a real 36-layer expert.
#
# Launch:
#   sbatch slurm_train_cd.sh
#   SMOKE=1 sbatch slurm_train_cd.sh          # 20 steps
#   CD_SELFTEST=1 SMOKE=1 sbatch slurm_train_cd.sh   # Gate A, then 20 steps

defaults:
  - sft_base
  - /models/teacher_ar1_5_10b_expert@model
  - /wandb: default
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs


model:
  # KaVaExpertTeacher (= TrainableAlpamayoR1) with the flow-matching loss replaced by the
  # consistency objective. The 10B teacher supplies BOTH the frozen VLM and the frozen
  # expert that provides the single teacher NFE per iteration.
  _target_: alpamayo1_5_distill.models.consistency_expert.ConsistencyExpertVLA.from_pretrained
  cd:
    m_rungs: 10           # one rung == one step of the deployment sampler
    cd_weight: 1.0
    x0_source: gt         # `teacher` needs the cached-sample build first
    metric: mse           # `pseudo_huber` needs huber_c calibrated for THIS action space
    normalizer: 1.0
    student_prune_layers: null  # explicit opt-in; see slurm_train_cd_pruned.sh
    teacher_num_layers: 36      # separately constructed frozen target, never pruned

data:
  # ⚠️ The teacher's config.json declares include_camera_ids / include_frame_nums TRUE and
  # the reference create_message() prefixes each image with "Front left camera: frame 0 ".
  # The repo's `default` processor sets both FALSE -- deliberately, to keep the 10B
  # comparable with our 2B -- and evaluating the 10B in that format moved min_ade
  # 1.116 -> 0.626, a 44% swing that produced two retracted findings. Student and teacher
  # must both use the annotated format, or the sequences differ and every position-wise
  # KV target is misaligned.
  train_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]          # front-wide, front-telephoto (loader order, NOT the global table)
    # ⚠️ NAV: one sample per ANNOTATION, each with its OWN t0_relative (116 distinct values,
    # event-anchored) and its own nav_text. NOT the default 5.1 s keyframe -- so nothing trained
    # here is comparable to the arms that use it; this run needs its own no-nav control.
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_train_anchors_50k_turnpreserved.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      # ⚠️ "route" MUST be here or nav_text is silently discarded: r1_5.py emits the route only
      # on `case "route":`. Canonical order, asserted in tests/test_recipe_static_contracts.py.
      # Both towers read ONE input_ids tensor, so the teacher sees the instruction too.
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  val_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: true
  # Set on the collator too. It only re-tokenizes the already-built text, so this is
  # belt-and-braces -- but the flags live in three independent places and a mismatch is
  # exactly the class of error that cost two findings.
  collate_fn:
    include_camera_ids: true
    include_frame_nums: true

trainer:
  report_to: wandb
  ddp_find_unused_parameters: false
  # ⚠️ The 8 identity stand-ins have NO parameters and the frozen VLM produces none either,
  # so DDP would otherwise warn about unused params every step.

  # ⚠️ NO deepspeed here, deliberately. DeepSpeed's bf16 casts parameters but does NOT wrap
  # the forward in torch.autocast; `action_in_proj` (PerWaypointActionInProjV2) forces
  # `x.float()` internally, so its fp32 activations meet bf16 weights and raise
  # "mat1 and mat2 must have the same dtype". Every other path here (evaluate_hf:122,
  # initial_action_embeds) runs under autocast for exactly this reason. Plain bf16=True in
  # sft_base gives the Trainer's native autocast, which handles it.
  # Affordable: only 2.28 B trains, so weights+grads+Adam ~ 36 GB on top of the frozen
  # 8 B VLM (~16 GB) -- fits an 80 GB card without ZeRO sharding.
  # ⚠️ Must be an explicit null: sft_base.yaml:62 sets `deepspeed: configs/deepspeed/zero2.json`,
  # so merely omitting the key inherits that RELATIVE path, which accelerate then tries to
  # base64-decode as an inline config ("binascii.Error: Incorrect padding").
  deepspeed: null
  # ⚠️ MUST be false: KaVaExpertTeacher raises "does not support gradient checkpointing".
  # Affordable here because only the 2.28 B expert is trainable and it sees just 64 action
  # tokens -- the frozen VLM builds no graph (its params are requires_grad=False and the
  # inputs do not require grad), so its 3073-token activations are never retained.
  gradient_checkpointing: false

  # ⚠️ bs=4, not 1. Measured on the 4-camera run: GPU util was 100% on one rank and 44% on
  # the other, i.e. one rank idled >half the time -- an 8B VLM prefill at batch 1 leaves the
  # card underfed. Same effective batch as before (4 x 3 x 2 GPUs = 24), 4x fewer launches.
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 3
  # Same 2e-5 the expert-on-student and pruned-expert arms use: this fine-tunes 2.28 B of
  # already-trained expert, it does not steer an 8 B VLM. Conservative on purpose -- the
  # student STARTS at the teacher and consistency training only has to add self-consistency
  # across rungs, not rebuild the field.
  # ⚠️ 2 workers (the sft_base default) is what capped the KD arm at 21.7 s/it while each
  # clip decodes 16 video frames; raising it took that arm to 10.3 s/it (commit 1f80121).
  dataloader_num_workers: 6
  learning_rate: 2e-5
  warmup_steps: 200
  num_train_epochs: 1
  # ⚠️ step-based, NOT epoch. An epoch-only policy left the 16-hour L_freerun run with
  # NOTHING on disk when it was killed at step 288 of 3196. 400 also gives the intermediate
  # checkpoints the cd_loss-vs-min_ade correlation check needs.
  save_strategy: steps
  save_steps: 400
  save_total_limit: 5

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_cd_expert_2cam_nav_lcdrive

# ⚠️ REQUIRED, not optional. The `/wandb: default` group ships `team: ???` and `project: ???`,
# and train_hf does `init_wandb(**cfg.wandb)` -- the `**` resolves EVERY key, so an unset one
# raises MissingMandatoryValue during hydra resolution, before wandb is reached.
wandb:
  team: zrb20
  project: alpamayo1_5-consistency-distill
  group: cd_expert_2cam_nav

# ⚠️ The EMA callback is what makes `theta^-` a real EMA and what puts the EMA weights into
# the saved checkpoint. `callbacks:` is instantiated by train_hf.py:59-62 and has never been
# used by any config in this tree -- so this block, not an entry-point edit, is the wiring.
# The swap into the live model happens in KaVaTrainer._save_checkpoint, NOT in an on_save
# callback: transformers 4.57.1 runs _save_checkpoint BEFORE callback_handler.on_save
# (trainer.py:3227-3229), so an on_save swap lands after the bytes are written.
callbacks:
  ema:
    _target_: alpamayo1_5_distill.models.ema.EMACallback
    decay: 0.999          # horizon 1/(1-decay) = 1000 steps, ~63% of a 1598-step epoch
    warmup_steps: 100     # shadow tracks theta exactly until then, so the target is live
    save_ema_weights: true
    liveness_check_at: 200

evaluate:
  eval_ckpt: null
