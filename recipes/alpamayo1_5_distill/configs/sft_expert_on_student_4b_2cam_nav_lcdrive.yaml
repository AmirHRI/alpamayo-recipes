# Train the ACTION EXPERT against the 2-CAMERA NAV-CONDITIONED 4B STUDENT's cache. VLM FROZEN.
#
# The 4B counterpart of sft_expert_on_student_2b_nav_lcdrive.yaml, on the student from
# ARM=nav4bmix2cam (block m=1 + span m=9 at equal weight, 50k event-anchored annotations,
# 2 front cameras, 5 epochs).
#
# Measured starting point for this exact student, stitched onto the TEACHER's expert,
# n=1000 on nav_lcdrive_val_mysubset_1k with cameras [1,3]:
#   teacher VLM  + teacher expert   min_ade 0.7155   <- ceiling under the same 2-cam input
#   THIS student + teacher expert   min_ade 0.9689   <- this run's starting point
# so there is 0.2534 of min_ade between the student's cache and the ceiling. The precedent
# for this arm on the 4B closed 19% of an analogous gap (1.6008 -> 1.4044).
#
# ⚠️ The DATA must match what the student was trained on, or the expert is adapted to a cache
# the student never produces: same 50k annotations, same per-anchor t0, same 2 cameras, and
# "route" in components_order. CameraSubsetPAIDataset raises if annotations_path is set
# without "route", which is the guard that makes a silent nav-less run impossible.
#
# ⚠️ NO PRUNE_EXPERT_LAYERS, unlike both 2B variants. The 4B student's text tower is 36 deep,
# which already matches the teacher's 36-layer expert, so the depth remap in
# stitched_model._load_teacher_non_vlm is an identity and pruning would CREATE the mismatch
# the 2B arms use it to avoid. Pass PRUNE_EXPERT_LAYERS=none to slurm_train_eos.sh.

defaults:
  - sft_base
  - /wandb: default
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

model:
  _target_: alpamayo1_5_distill.models.stitched_model.TrainableStitchedAlpamayoR1.from_student
  # The 2-camera nav-conditioned 4B, end of epoch 5 (job 20600).
  checkpoint_path: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_kd_4b_nav4bmix2cam_m9w1.0_lcdrive/checkpoint-7815
  # ⚠️ the SNAPSHOT dir, not the repo root -- the parent has no config.json/weights.
  vlm_name_or_path: /temp/achahe/hf_cache/hub/models--Qwen--Qwen3-VL-4B-Instruct/snapshots/ebb281ec70b05090aa6165b016eac8ec08e71b17
  teacher_checkpoint_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  # Supplies the +4000 trajectory vocabulary the student tower was built with.
  alpamayo_config_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  attn_implementation: sdpa
  cotrain_vlm: false

data:
  # Identical preprocessing to every other arm here -- the teacher declares
  # include_camera_ids / include_frame_nums TRUE and evaluating it in the other format
  # moved min_ade 1.116 -> 0.626 once, which produced two retracted findings.
  train_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]          # front-wide, front-telephoto -- what the student was trained on
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_train_anchors_50k_turnpreserved.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  # ⚠️ NAV-conditioned val here, matching sft_expert_on_student_2b_nav_lcdrive.yaml -- and
  # matching the val set the 0.9689 starting point was measured on, so the training-time
  # val loss and the stitched eval refer to the same distribution.
  val_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_val_mysubset_1k.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_mysubset_1k_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  collate_fn:
    include_camera_ids: true
    include_frame_nums: true

trainer:
  report_to: wandb
  ddp_find_unused_parameters: false
  # ⚠️ The frozen VLM produces no gradients, so DDP would otherwise warn every step.

  # ⚠️ NO deepspeed here, deliberately. DeepSpeed's bf16 casts parameters but does NOT wrap
  # the forward in torch.autocast; `action_in_proj` (PerWaypointActionInProjV2) forces
  # `x.float()` internally, so its fp32 activations meet bf16 weights and raise
  # "mat1 and mat2 must have the same dtype". Plain bf16=True in sft_base gives the
  # Trainer's native autocast, which handles it.
  # Affordable WITHOUT ZeRO because only 2.28 B trains: weights+grads+Adam ~ 27 GB on top of
  # the frozen 4 B VLM (~9 GB). Note this is DDP, so that optimizer state is REPLICATED per
  # rank -- adding GPUs does not reduce it, unlike the ZeRO-2 distillation runs.
  # ⚠️ Must be an explicit null: sft_base.yaml sets a RELATIVE `configs/deepspeed/zero2.json`,
  # which accelerate then tries to base64-decode ("binascii.Error: Incorrect padding").
  deepspeed: null
  # ⚠️ MUST be false: KaVaExpertTeacher raises "does not support gradient checkpointing".
  # Affordable here because only the 2.28 B expert is trainable and it sees just 64 action
  # tokens -- the frozen VLM builds no graph (its params are requires_grad=False and the
  # inputs do not require grad), so its per-image activations are never retained. This is
  # also what makes each step fast: no recompute, and no backward through the VLM at all.
  gradient_checkpointing: false

  # 4 GPUs x 8 x 1 = 32 effective, matching the distillation runs. ACCUM=1 means one
  # optimizer step per forward/backward -- no accumulation, no no-sync micro-steps.
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  # Fine-tuning 2.28 B of already-trained expert onto a slightly different cache, not
  # steering the VLM. Conservative: it starts at teacher weights and should not move far.
  learning_rate: 2e-5
  # ⚠️ warmup is a STEP COUNT and moves with the EFFECTIVE batch. 50,000 annotations at
  # 4 x 8 x 1 = 32 is 1,563 steps/epoch; the 12.5% fraction the 2B nav arm used gives 195.
  warmup_steps: 195
  num_train_epochs: 2
  # One checkpoint per epoch, matching sft_expert_on_student_2b_nav_lcdrive.yaml.
  # 2 epochs -> 2 checkpoints (steps 1563 and 3126), both kept under the limit.
  # ⚠️ The tradeoff vs save_steps: a crash now loses up to a FULL epoch, which is what left
  # the 16-hour L_freerun run with nothing on disk when it died at step 288 of 3196. That is
  # bounded here only because 2 epochs is a short run.
  save_strategy: epoch
  save_total_limit: 10

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_eos_4b_2cam_nav_lcdrive

# ⚠️ REQUIRED, not optional. The `/wandb: default` group ships `team: ???` and
# `project: ???`, and train_hf does `init_wandb(**cfg.wandb)` -- the `**` resolves EVERY
# key, so an unset one raises MissingMandatoryValue during hydra resolution.
wandb:
  team: zrb20
  project: alpamayo1_5-expert-on-student
  group: expert_on_student_4b

evaluate:
  eval_ckpt: null
