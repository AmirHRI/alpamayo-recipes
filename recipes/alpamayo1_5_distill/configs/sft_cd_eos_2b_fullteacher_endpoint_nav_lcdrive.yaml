# ARM A -- ENDPOINT distillation against the cached full Alpamayo-1.5 rollouts.
#
# Same student, same cache, same schedule as
# `sft_cd_eos_2b_fullteacher_cache_nav_lcdrive` (job 591). ONE variable changes: the
# objective. That run's bands say why:
#
#     band     job 591 start -> end        online-teacher CD (job 580)
#     anchor   3.7e-4 -> 4.4e-4  (flat)    1.3e-5 -> 7.7e-5
#     mid      3.0e-3 -> 1.8e-3            7.2e-4 -> 4.5e-4
#     noise    4.0e-2 -> 5.3e-2  (+32%)    1.8e-2 -> 1.3e-2  (-25%)
#
# The noise band -- exactly what a 1-NFE sampler evaluates -- got WORSE, because the CD
# bootstrap is anchored on a rung the 2B student cannot fit (the 10B's transition
# velocity), that rung carries ~0.3% of the gradient (tau^2 = 0.01 x 1/10 of samples),
# and the EMA horizon (1/(1-0.999) = 1000 steps) needs ~10x this run's 3126 steps to
# cross ten rungs.
#
# So: drop the bootstrap. The cache already holds, for every clip, K pairs of
# (initial noise, the teacher's answer for that noise). Regress on them directly:
#
#     L = || x_hi + tau_hi * v_theta(x_hi, tau_hi)  -  states[k, M] ||^2
#
# no EMA, no solver step, no chain -- and the target is noise-PAIRED, so the teacher's
# six-way spread is distilled rather than averaged into the conditional mean (which is
# what `x0_source: gt` did, at 4x the residual and rising: 0.564 -> 0.617).
#
# Reference to beat: this student at 10 steps, min_ade 1.3974 / ade 2.4859 / diversity
# 1.609. Job 591 reached min_ade 1.8028 (nfe1) and 1.5837 (nfe2).
defaults:
  - sft_base
  - /wandb: default
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

model:
  _target_: alpamayo1_5_distill.models.consistency_expert.ConsistencyExpertVLA.from_eos_checkpoint
  eos_checkpoint_path: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_eos_2b_nav_e3_clean_maskfix_e2_lcdrive/checkpoint-4168
  vlm_name_or_path: /temp/achahe/hf_cache/hub/Cosmos-Reason2-2B
  alpamayo_config_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  cotrain_vlm: false
  stop_grad_from_vlm: true
  cd:
    teacher_source: cached_full
    # Still 10: it is the cache's grid, and it sets which tau values x_hi is drawn from
    # (tau_hi = 1 - s/10, so {0.1 ... 1.0}). It no longer defines a bootstrap chain.
    m_rungs: 10
    # THE CHANGE. cd_weight 0 turns off the bootstrap term AND skips the EMA target
    # forward, so this arm runs ONE expert forward per step instead of two.
    cd_weight: 0.0
    x0_gt_weight: 1.0
    x0_gt_normalizer: 1.0
    # The cached endpoint states[k, M] for the SAME noise draw -- not the dataset action.
    x0_source: teacher
    metric: mse
    normalizer: 1.0
    student_prune_layers: null
    teacher_num_layers: 28

data:
  train_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_train_anchors_50k_turnpreserved.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    teacher_trajectory_cache_root: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/teacher_action_rollouts_full10b_2cam_nav_k6_m10
    teacher_trajectory_cached_only: false
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  val_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_val_mysubset_1k.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_mysubset_1k_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  collate_fn:
    include_camera_ids: true
    include_frame_nums: true

trainer:
  report_to: wandb
  ddp_find_unused_parameters: false
  deepspeed: null
  gradient_checkpointing: false
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  dataloader_num_workers: 9
  # Unchanged from job 591 on purpose: the objective is the only variable. Adam largely
  # normalises away the 10x larger term weight, so the step size stays comparable.
  learning_rate: 2e-5
  warmup_steps: 200
  num_train_epochs: 2
  save_strategy: epoch
  save_total_limit: 3

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_cd_eos2b_fullteacher_endpoint_nav_e2_bs32_20260829

wandb:
  team: zrb20
  project: alpamayo1_5-consistency-distill
  group: cd_eos_student_2b_fullteacher_endpoint

# ⚠️ NO `callbacks.ema` block, and that is the point. With cd_weight=0 there is no target
# network to build, so an EMA would only burn 7.1 GB and make the saved checkpoint a
# lagging average of the weights that were actually trained. `sft_base` defaults to `{}`.

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_cd_eos2b_fullteacher_endpoint
run_name: cd_eos2b_endpoint_${now:%m%d-%H%M}
