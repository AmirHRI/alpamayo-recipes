# Score the EXPERT-ON-STUDENT (EOS) model for the 4B arm: nav-conditioned 2-camera 4B
# student VLM + the expert that was FINE-TUNED ON ITS OWN CACHE. The read-out for
# sft_expert_on_student_4b_2cam_nav_lcdrive (job 20615).
#
# ⚠️ BOTH model paths point at the SAME EOS checkpoint, deliberately:
#   * `checkpoint_path`         -> `load_alpamayo1_vlm` takes ONLY `vlm.*` = the frozen
#     student, byte-identical to output_kd_4b_nav4bmix2cam_m9w1.0_lcdrive/checkpoint-7815
#     since cotrain_vlm=false, and
#   * `teacher_checkpoint_path` -> `_load_teacher_non_vlm` takes ONLY
#     `expert.* / action_in_proj.* / action_out_proj.* / action_space.*` = the TRAINED expert.
# Pointing the second at the 10B instead silently scores the *control* arm and would look
# like a null result.
#
# ⚠️ DO NOT export PRUNE_EXPERT_LAYERS. Unlike the 2B arm this expert is 36 layers deep --
# it was BUILT 36 deep from the 4B text config and saved that way -- so n_ckpt == n_have and
# the DEPTH REMAP branch (expert_holder.py:143) must not run. The pin exists only to squeeze
# the teacher's 36-layer expert into a 28-layer 2B student; here it would CREATE a mismatch.
#
# ⚠️ NAV + EVENT-ANCHORED t0, cameras [1, 3]. This must mirror the TRAINING config exactly:
# same annotations, same per-anchor t0, "route" in components_order, camera-ids + frame-nums
# TRUE. The expert was made tolerant of the cache THIS conditioning produces; changing any of
# them desynchronises the halves of the stitch. Dropping the camera-id / frame-num flags
# alone once moved min_ade 1.116 -> 0.626.
#
# Comparisons that are VALID against this config (all n=1000, 2-camera, route-conditioned,
# event-anchored — measured this session):
#     teacher, 2 cam (ceiling) ................. min_ade 0.7155   job 20611
#     2-cam student ckpt-7815, teacher expert .. min_ade 0.9689   job 20610  <- baseline to beat
#     2-cam student + expert-on-student ........ ?                 this
# The 4B precedent for the same intervention elsewhere in this tree was -0.196 min_ade.

defaults:
  - sft_base
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

model:
  _target_: alpamayo1_5_distill.models.stitched_model.StitchedAlpamayoR1.from_stitch
  # The student's base tower: Qwen3-VL-4B-Instruct, 36 text layers.
  vlm_name_or_path: /temp/achahe/hf_cache/hub/models--Qwen--Qwen3-VL-4B-Instruct/snapshots/ebb281ec70b05090aa6165b016eac8ec08e71b17
  # Supplies the +4000 trajectory vocabulary AND expert_cfg / diffusion_cfg / action_*_cfg --
  # the config only; no weights are taken from here.
  alpamayo_config_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  # Left null on purpose: evaluate_hf.py:70 overwrites it with `evaluate.eval_ckpt`, which is
  # how slurm_eval_eos.sh's CKPT reaches the student tower. Setting it here is discarded.
  checkpoint_path: null
  # THE POINT OF THIS CONFIG: the expert comes from the EOS run, not from the 10B.
  # Overridden per-run by the launcher's ++model.teacher_checkpoint_path.
  teacher_checkpoint_path: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_eos_4b_2cam_nav_lcdrive/checkpoint-1563
  # ⚠️ REQUIRED. flash_attention_2 dies on the expert's 4D mask with a device-side assert
  # (alpamayo_r1.py:248-262); training escapes it only because it passes attention_mask=None.
  attn_implementation: sdpa

data:
  val_dataset:
    # CameraSubsetPAIDataset (not PAIDatasetWithNav directly): it slices the camera axis
    # BEFORE preprocessing so the prompt is rebuilt from 2 cameras, and it promotes its base
    # to PAIDatasetWithNav automatically once `annotations_path` is given. Using the plain
    # nav dataset here is exactly the mistake that trained job 20550 on 4 cameras.
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]          # front-wide, front-telephoto
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_val_mysubset_1k.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_mysubset_1k_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      # "route" is what carries nav_text; r1_5.py emits it only on `case "route":`, so
      # removing it does not error -- the instruction just silently vanishes.
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      # ⚠️ true here, false in the training config: eval must build a PROMPT to roll out from,
      # not a teacher-forced label sequence.
      generation_mode: true
  collate_fn:
    include_camera_ids: true
    include_frame_nums: true

trainer:
  # No optimizer exists at eval and both of these break it: the ZeRO-2 json expects an
  # optimizer to shard, and checkpointing forces use_cache=False -- which would disable the
  # very KV cache the expert reads.
  deepspeed: null
  gradient_checkpointing: false
  report_to: none
  per_device_eval_batch_size: 4
  dataloader_num_workers: 4

# ⚠️ Explicit null. `/wandb: default` ships `team: ???` / `project: ???` and any `**cfg.wandb`
# resolution raises MissingMandatoryValue before wandb is ever reached.
wandb: null

evaluate:
  eval_ckpt: null
  max_eval_steps: -1
  torch_dtype: bfloat16
  metric_runner:
    _target_: alpamayo.metrics.metric_runner.MetricRunner
    metrics:
      # K=6 samples -> min_ade@6. Identical to every other arm's sampler so the comparison
      # is not confounded by the RNG stream.
      - _target_: alpamayo.metrics.metric_api.ReasoningSampler
        num_traj_sets: 1
        top_p: 0.98
        temperature: 0.6
        traj_only_generation: false
        max_generation_length: 256
        # Denoising (NFE) budget. ⚠️ This key MUST exist here even though the script always
        # overrides it: `++evaluate...diffusion_kwargs.inference_step=N` cannot create the
        # intermediate `diffusion_kwargs` node, so without this line the override is silently
        # rejected and every run would quietly score at the default budget.
        diffusion_kwargs:
          inference_step: 10
      - _target_: alpamayo.metrics.metric_api.DistanceMetrics

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/evaleos

task_name: alpamayo_1_5_eos_eval
run_name: eos_4b_2cam_nav_${now:%m%d-%H%M}
