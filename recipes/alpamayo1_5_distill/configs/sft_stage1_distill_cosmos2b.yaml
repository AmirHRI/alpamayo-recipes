# Stage-1 latent-reasoning distillation of the 2B Cosmos-Reason2 student.
#
# The student trains CoT-FREE (the `nav` processor, no `cot` in components_order)
# with the usual trajectory-token CE loss PLUS a latent loss that matches its
# hidden state at <traj_future_start> to the cached teacher hidden (generated
# offline with CoT by scripts/generate_teacher_features.py). This compiles the
# teacher's reasoning into the KV the action expert reads, without any
# autoregressive reasoning tokens at inference.
#
# Prerequisite: run scripts/generate_teacher_features.py first, then point
# `data.train_dataset.teacher_cache_path` at its output and set
# `model.teacher_hidden_dim` to the cache's teacher_hidden_dim.
#
# Launch (from the alpamayo1_5_sft venv, PYTHONPATH includes recipes/):
#   torchrun --nproc_per_node 1 -m alpamayo1_5_sft.train_hf \
#     --config-path pkg://alpamayo1_5_distill/configs \
#     --config-name sft_stage1_distill_cosmos2b \
#     data.train_dataset.teacher_cache_path=/path/to/teacher_features.safetensors
defaults:
  - sft_base
  - /models/cosmos_reason2_2b_distill@model
  - override /vla_processor@data.train_dataset.vla_preprocess_args: nav
  - override /vla_processor@data.val_dataset.vla_preprocess_args: nav
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

data:
  train_dataset:
    _target_: alpamayo1_5_distill.data.distill_dataset.DistillNavDataset
    _recursive_: false
    local_dir: /data/datasets/physical_ai_av/
    annotations_path: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/nav_demo_samples.json
    chunk_ids: [1519, 1657, 1984, 2368]
    teacher_cache_path: ???   # set to the generated teacher_features.safetensors
    inject_cot: false         # student is text-silent (no CoT in context)
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo1_5_distill.data.distill_dataset.DistillNavDataset
    _recursive_: false
    local_dir: /data/datasets/physical_ai_av/
    annotations_path: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/nav_demo_samples.json
    chunk_ids: [1519, 1657, 1984, 2368]
    teacher_cache_path: null  # eval uses generation; no teacher feature needed
    inject_cot: false
    vla_preprocess_args:
      generation_mode: true

trainer:
  report_to: none
  lr_multiplier:
    vlm.model.visual: 0.1
    # The latent projector is randomly initialised (unlike the pretrained VLM)
    # and must learn the 2048 -> teacher_hidden map; give it a higher LR so the
    # (scale-sensitive) smooth-L1 latent term converges alongside the CE term.
    latent_proj: 10.0
  ddp_find_unused_parameters: false
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_steps: 500
  num_train_epochs: 3

paths:
  output_dir: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_stage1_distill_cosmos2b

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_distill_stage1_cosmos2b
