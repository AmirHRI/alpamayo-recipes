# Student: Cosmos-Reason2-2B VLM + KAVA latent slots supervised by the teacher's
# compressed KV cache (arXiv:2510.02312).
#
# `teacher_hidden_dim` drives the parent's single-vector loss (lambda_1) and MUST
# equal the width of the cached teacher hidden: 4096 = Alpamayo-1.5-10B, 2048 = the
# 2B stand-in teacher. Set it to null to disable that term (KAVA reports the
# CODI-style loss destabilising on long traces and uses lambda_1 = 0 on its hardest
# dataset), leaving L_KV as the only distillation signal.
_target_: alpamayo1_5_distill.models.kava_model.KaVaReasoningVLA.from_pretrained_vlm
vlm_name_or_path: /data/achahe/alpasim/huggingface/hub/Cosmos-Reason2-2B
alpamayo_config_path: /data/achahe/alpasim/huggingface/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
# Warm start from the trained Stage-1 LCDrive VLM rather than the base 2B. Loaded
# BEFORE init_kava runs, so the slots' vocab-init reads the fine-tuned embeddings.
checkpoint_path: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/output_stage1_cosmos2b_lcdrive/checkpoint-3597

# lambda_1: the endpoint hidden match (KAVA's L_CODI analogue), inherited.
teacher_hidden_dim: 4096
# 0.0. The endpoint term converged almost immediately (59.7 -> 0.15) and spent the run
# at ~3% of CE's gradient, so it was contributing nothing while remaining a confound --
# it drags a 2048-d hidden toward a 4096-d teacher through a randomly-initialised
# projector. KAVA sets lambda_1 = 0 on its hardest dataset for the same reason.
# Set 0.01 to restore it (that value was calibrated to ~131% of CE at step 0).
latent_loss_weight: 0.0
latent_cosine_weight: 0.1

kava:
  # M — must equal the collator's num_slots AND the cached tier's M.
  # 8, not 16: the teacher's LCDrive CoT is ~13 tokens (measured over all 38,336
  # clips), so M=16 leaves R-KV eviction inactive on 92% of them. M=8 engages it on
  # 79%, which is the point of the method.
  num_slots: 8
  # Depth of the teacher whose cache was recorded; builds the 28 -> 36 layer map.
  teacher_layers: 36
  # T — passes that produce the latents. 1 = the slots ride the single prefill pass,
  # which the causal mask makes exactly free (nested-prefix invariance is measured at
  # cos = 1.000000000, reasoning-setup-2b.md §9). T > 1 adds PCCoT Jacobi refinement:
  # better per KAVA's Fig 7, but each extra iteration costs a pass, and with ~85 ms of
  # the 100 ms budget already in prefill there is little room. Sweep it.
  jacobi_iters: 1
  # lambda_2 on L_KV, CALIBRATED BY MEASUREMENT against the warm-started student.
  #
  # It cannot be taken from the paper: this loss averages over every
  # (layer, head, slot, dim) element -- 458,752 at M=8 -- whereas KAVA Eq.7 divides by
  # 2M=16, a factor of L*H*D = 28,672. It also cannot be calibrated against the BASE
  # 2B: on the base model CE is ~31 and lambda_2=50 gave parity, but warm-starting
  # drops CE to ~3.1 and the same weight then contributed 5898% of CE's gradient.
  #
  # Measured at step 0 of the warm-started run: unweighted ||grad|| was ce 1.305,
  # latent 171, kv 1.539. lambda_2=1 puts L_KV at ~118% of CE. Re-measure if the warm
  # start, M, or the layer map changes -- gradshare_kv in the logs is the tripwire.
  kv_loss_weight: 1.0
  # l1, NOT smooth_l1. MEASURED: smooth_l1 is self-extinguishing here. Its gradient is
  # proportional to the residual, so as the student converges toward the teacher the
  # objective quietly stops steering. On real cached targets with layerwise_std on:
  #
  #   residual (x std)   2.70     0.62     0.30     0.10
  #   smooth_l1 ||grad|| 4.8e-5   3.0e-5   1.6e-5   5.3e-6     <- decays 9x
  #   l1        ||grad|| 5.3e-5   5.3e-5   5.3e-5   5.3e-5     <- constant
  #
  # The first run traversed 2.7 -> ~0.3 std (kv_loss 2.16 -> 0.193) and its backbone
  # gradient share collapsed 89% -> 10% within ~300 of 7,191 steps, so ~96% of training
  # was effectively plain CE. l1 holds the gradient constant instead.
  kv_loss_type: l1
  # KAVA's "Layer-wise std" row: normalise each layer's residual by its teacher
  # target's std. Qwen3-VL K/V magnitudes differ by orders of magnitude across depth
  # ("massive activations"), so leaving this off lets the largest layers dominate.
  kv_layerwise_std: true
  # "projector" learns a per-layer 1024->1024 change of basis (~59M throwaway params,
  # identity-initialised so training STARTS at the `direct` objective); "direct"
  # matches raw K/V for free. Per-layer geometry already agrees (8 x 128 = 1024 on
  # both sides) — what differs is the learned W_k/W_v basis, since unlike KAVA this
  # is cross-model rather than self-distillation.
  kv_align: projector
  # null = uniform stride with endpoints preserved (28 -> 36).
  kv_layer_map: null
  # Seed the slots from the most frequent tokens in the teacher's own CoT. Measured
  # to beat randn on this exact model (§9.1 C3: 3.71 vs 4.98 starting loss, ~3x
  # faster convergence), reproducing Lester et al. (2021) below ~10B.
  slot_init: vocab
  slot_init_cot_text: null   # set to the cache_root holding cot_text.*.jsonl
  slot_init_std: 0.02
