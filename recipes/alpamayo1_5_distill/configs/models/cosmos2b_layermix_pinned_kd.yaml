# PINNED-ENDS VARIANT of the layer mix: the first 4 and last 2 cache layers reach the expert
# UNALTERED, and only the middle 22 -> 30 is learned.
#
# Student: Cosmos-Reason2-2B (28 text layers), distilled from the 10B teacher, driving the
# teacher's FULL 36-LAYER action expert.
#
# WHY THIS EXISTS. Expert layer l reads VLM cache layer l, so a 28-layer student used to force
# the expert down to 28 (set C: layers {4,10,13,15,19,25,27,34} dropped). That cut is expensive
# BEFORE the student is even involved: PRUNING.md measures the teacher at min_ade 0.5776 through
# its full 36-layer expert and 0.7893 through the set-C ablation. Every 2B block/span arm so far
# has been optimising toward the lower of those two ceilings.
#
# WHAT REPLACES IT. Keep all 36 expert layers, and SYNTHESISE the 36 cache slots from the
# student's 28 layers with learned convex mixing matrices, block-structured 4 x (7 -> 9):
#
#   student  0..3   |   4..14      15..25   |  26..27
#            pinned  |  P_K/P_V     P_K/P_V  |  pinned      (2 learned blocks of 11 -> 15)
#   expert   0..3    |   4..18      19..33   |  34..35
#
#   P = softmax over the 11 SOURCE layers, so every synthesised slot is a convex combination
#   and block locality is structural. 2 x 2 x 11 x 15 = 660 scalars total.
#
# ⚠️ PRUNE_EXPERT_LAYERS MUST NOT BE SET. Pruning and mixing are alternatives, not companions;
# kd_model._init_layer_mix raises if both are on. This is the one arm in the tree that does not
# export it.
#
# ⚠️ The span term is what grades the hypothesis. block_span_mix=9 makes each disjoint span
# exactly one block's 9 expert layers driven by exactly one block's 7 student layers
# (_span_sweep's range(0, 36-9+1, 9) = [0, 9, 18, 27]). Any other m straddles the blocks.
#
# Compatibility, verified: kv_heads x head_dim = 8x128 = 1024 on the 2B, the 10B teacher AND
# expert_cfg -- so the cache needs no width projection. 2B hidden 2048 == expert_cfg 2048.
_target_: alpamayo1_5_distill.models.kd_model.KDReasoningVLA.from_pretrained_vlm
vlm_name_or_path: /temp/achahe/hf_cache/hub/Cosmos-Reason2-2B
alpamayo_config_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
checkpoint_path: null

teacher_checkpoint_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
teacher_vlm_name_or_path: /temp/achahe/hf_cache/hub/models--nvidia--Cosmos-Reason2-8B/snapshots/a9fae2cf89dc64db96b12860417f0eb403013bb9

kd:
  # ---- the layer mix ----
  layer_mix: true
  # The expert's depth, overriding the one it would inherit from the 2B's text config. 36 is
  # the teacher's own, so its 397 expert tensors load 1:1 and expert_holder's depth remap
  # never fires -- check the log for "36 layers" and the ABSENCE of "[block] expert REMAP".
  layer_mix_expert_layers: 36
  # 28 = 4x7 and 36 = 4x9, so the blocks are exact. Must divide both depths.
  # ⚠️ 2, not 4: with the head and tail PINNED the learned middle is 22 -> 30, which factors
  # as 2 blocks of 11 -> 15. n_blocks must divide the UNPINNED middle, not the full depth.
  layer_mix_blocks: 2

  # PINNED IDENTITY ENDS. Student layers 0..3 wire straight to expert slots 0..3, and 26..27
  # to 34..35 -- no parameters, no blending, bit-exact pass-through. Only slots 4..33 are
  # synthesised, from student layers 4..25.
  # WHY THESE ENDS. PRUNING.md §3 lists the deepstack/ViT-injection layers 0-2 as structurally
  # protected, and its causal ladder measured layers 19-27 as carrying ~95% of the recoverable
  # gap. Those are exactly the two regions where substituting a blend for the real cache layer
  # is most likely to cost something -- and in the unpinned arm slots 1, 2, 3 and 34 were
  # blended (93/6, 87/13, 93/6, 93/6) rather than passed through.
  layer_mix_pin_head: 4
  layer_mix_pin_tail: 2
  # Per-output-slot scalar gain, OFF. A mix drifting toward uniform shrinks ||K|| by up to
  # sqrt(7) for uncorrelated layers; kv_ratio_k / kv_ratio_v report that every step, so turn
  # this on in response to a measurement rather than in anticipation of one.
  layer_mix_gain: false

  # How far the init is pulled from the depth-matched tent toward one-hot (0 = tent, 1 =
  # nearest-source gather).
  # ⚠️ The tent is MEASURED HARMFUL: in the validated teacher-mode oracle (n=500) one-hot
  # gather scored min_ade 0.7396 against the tent's 0.8059 -- blending adjacent layers
  # everywhere cost 0.066, and the tent was even worse than pruning itself. That behavioural
  # comparison is the only evidence bearing on this value; it says "sharper than the tent"
  # and does not pin a number, so 0.75 is a judgement call and 1.0 is the endpoint that won.
  # ⚠️ Do NOT re-derive this from the fitted P's shape. Per column its effective sources are
  # 2.222 vs the tent's 1.489 -- maximally sharp on the 7/9 columns that had a pass-through
  # source and maximally broad on the 2 that did not, which is the probe's degeneracy showing
  # through rather than a property of a good mix.
  layer_mix_sharpen: 0.75

  # ---- the objective ----
  # ⚠️ ce_weight / kd_weight / kv_weight are 0 in the launcher, matching every other block arm.
  # kv_weight in particular MUST stay 0: L_KV maps the student's raw 28 layers through
  # build_layer_map, a contradictory convention, and kd_model raises rather than run both.
  block_weight: 1.0
  block_timestep: beta
  block_norm: teacher
  block_span: 1
  # BOTH objectives, weighted mean: teacher-forced per-layer (m=1) grades each of the 36 slots
  # in isolation; span(m=9) grades whether one block's 9 slots SURVIVE being chained on a cache
  # built from only 7 student layers. The second is the one this arm is really asking about.
  block_span_mix: 9
  block_span_mix_weight: 1.0

  kd_temperature: 1.0
  kv_align: direct
  kv_loss_type: l1
  kv_layerwise_std: true
  log_kv_regions: false     # kv_weight is 0 here; the region splits would report on nothing
