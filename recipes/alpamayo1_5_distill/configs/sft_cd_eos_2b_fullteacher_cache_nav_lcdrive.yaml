# Consistency distillation of the compact EoS policy against exact OFFLINE
# rollouts from the released full Alpamayo-1.5 model.
#
# Online/EMA: frozen epoch-3 2B VLM + its 28-layer EoS expert.
# Reference:  full 8B VLM + full 36-layer expert, already evaluated for all ten
#             chained Euler steps and stored as [K,11,64,2] action states.
#
# This deliberately matches OUTPUTS, not internal KV caches: each architecture
# conditions its own expert with its own compatible VLM.  It also removes the
# full teacher forward from the training hot loop.
defaults:
  - sft_base
  - /wandb: default
  - _self_

hydra:
  searchpath:
    - pkg://alpamayo1_5_sft/configs

model:
  _target_: alpamayo1_5_distill.models.consistency_expert.ConsistencyExpertVLA.from_eos_checkpoint
  eos_checkpoint_path: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_eos_2b_nav_e3_clean_maskfix_e2_lcdrive/checkpoint-4168
  vlm_name_or_path: /temp/achahe/hf_cache/hub/Cosmos-Reason2-2B
  alpamayo_config_path: /temp/achahe/hf_cache/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
  cotrain_vlm: false
  stop_grad_from_vlm: true
  cd:
    teacher_source: cached_full
    m_rungs: 10
    cd_weight: 1.0
    # Retain the direct endpoint term from cdeos2b_580; the new experiment changes
    # only the teacher reference. This makes the comparison interpretable.
    x0_gt_weight: 0.1
    x0_gt_normalizer: 1.0
    x0_source: gt
    metric: mse
    normalizer: 1.0
    student_prune_layers: null
    # In this EoS factory this is the compact student's physical layer count.
    # cached_full never constructs an online teacher expert.
    teacher_num_layers: 28

data:
  train_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_train_anchors_50k_turnpreserved.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
    teacher_trajectory_cache_root: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/teacher_action_rollouts_full10b_2cam_nav_k6_m10
    teacher_trajectory_cached_only: false
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  val_dataset:
    _target_: alpamayo1_5_distill.data.camera_subset.CameraSubsetPAIDataset
    cameras: [1, 3]
    annotations_path: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/nav_lcdrive_val_mysubset_1k.json
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_mysubset_1k_clip_uuids.txt
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order: ["image", "traj_history", "route", "prompt", "traj_future"]
      components_prompt: ["traj_future"]
      label_components: ["traj_future"]
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
  collate_fn:
    include_camera_ids: true
    include_frame_nums: true

trainer:
  report_to: wandb
  ddp_find_unused_parameters: false
  deepspeed: null
  gradient_checkpointing: false
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  dataloader_num_workers: 9
  learning_rate: 2e-5
  warmup_steps: 200
  num_train_epochs: 2
  save_strategy: epoch
  save_total_limit: 3

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_distill/training/output_cd_eos2b_fullteacher_cache_x0gtw0.1_nav_e2_bs32_20260828

wandb:
  team: zrb20
  project: alpamayo1_5-consistency-distill
  group: cd_eos_student_2b_fullteacher_cache

callbacks:
  ema:
    _target_: alpamayo1_5_distill.models.ema.EMACallback
    decay: 0.999
    warmup_steps: 100
    save_ema_weights: true
    liveness_check_at: 200

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_cd_eos2b_fullteacher_cache
run_name: cd_eos2b_fullteacher_${now:%m%d-%H%M}
