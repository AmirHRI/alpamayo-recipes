# Stage 1 VLM fine-tune of the Qwen3.5-2B backbone for Alpamayo-1.5.
#
# Mirrors alpamayo1_5_sft's sft_stage1_cosmos2b.yaml. A1.5's data pipeline is
# annotation-driven (PAIDatasetWithNav needs nav_text / cot per sample), so a
# nav annotations JSON is required. For a smoke test we reuse the 20-sample
# demo annotations from alpamayo1_5_sft; swap `annotations_path` for the real
# LCDrive nav annotations once available (and widen `chunk_ids` accordingly).
defaults:
  - sft_base
  - /models/qwen3_5_2b@model
  - /wandb: default
  - override /vla_processor@data.train_dataset.vla_preprocess_args: nav
  - override /vla_processor@data.val_dataset.vla_preprocess_args: nav
  - _self_

data:
  train_dataset:
    _target_: alpamayo.data.pai_nav.PAIDatasetWithNav
    _recursive_: false
    local_dir: /data/datasets/physical_ai_av/
    annotations_path: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/nav_demo_samples.json
    chunk_ids: [1519, 1657, 1984, 2368]   # demo chunks present on disk (widen with real LCDrive nav data)
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo.data.pai_nav.PAIDatasetWithNav
    _recursive_: false
    local_dir: /data/datasets/physical_ai_av/
    annotations_path: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/nav_demo_samples.json
    chunk_ids: [1519, 1657, 1984, 2368]   # demo chunks present on disk (widen with real LCDrive nav data)
    vla_preprocess_args:
      generation_mode: true

trainer:
  report_to: wandb
  lr_multiplier:
    vlm.model.visual: 0.1
  ddp_find_unused_parameters: false
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_steps: 500
  num_train_epochs: 3

paths:
  output_dir: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft_qwen3_5/training/output_stage1_qwen3_5_2b

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_sft_stage1_qwen3_5_2b
