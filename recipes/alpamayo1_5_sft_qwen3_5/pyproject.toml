[project]
name = "alpamayo1-5-sft-qwen3-5"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alpamayo_r1",  # inference models, action_space, geometry.rotation, common.logging, etc.
  "alpamayo-recipes",  # recipe-side utilities (chat_template, data, metrics, common, etc.)
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "einops>=0.8.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "mediapy>=1.2.4",
  "opencv-python>=4.10.0",
  "pandas>=2.3.3",
  "physical_ai_av>=0.2.0",
  "pillow>=12.0.0",
  "torch==2.8.0",
  "torchvision>=0.23.0",
  "transformers==5.14.1",
  "flash-attn>=2.8.3",
  # Optional fast-path kernels for Qwen 3.5's Gated-DeltaNet (linear-attention)
  # layers; falls back to a pure-PyTorch path if absent, just slower.
  # "flash-linear-attention",
  # "causal-conv1d",
  "rich>=14.3.3",
  "wandb>=0.25.0",
  "torchmetrics==1.8.2",
  "deepspeed==0.19.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Look one level up (recipes/) so setuptools finds alpamayo1_5_sft_qwen3_5/ as a proper
# package. The editable install adds recipes/ to sys.path, making `alpamayo1_5_sft_qwen3_5`
# importable from within this directory once the venv is active.
[tool.setuptools.packages.find]
where = [".."]
include = ["alpamayo1_5_sft_qwen3_5*"]

[dependency-groups]
dev = [
  "matplotlib>=3.10.7",
  "mediapy>=1.2.4",
  "ipykernel>=6.29.3",
  "ipywidgets>=8.1.8",
  "pytest>=8.0.0",
  "tqdm",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
# alpamayo_r1's own pyproject.toml pins transformers==4.57.1 (needed by the
# qwenvl3 path other recipes use); override it here since this recipe's fork
# (see [tool.uv.sources] below) only needs to satisfy the Qwen 3.5 path.
override-dependencies = ["deepspeed==0.19.1", "transformers==5.14.1"]

[tool.uv.sources]
# Fork of NVlabs/alpamayo with the Qwen 3.5 dispatch + hybrid-cache patch
# (see `alpamayo_r1/models/hybrid_cache.py`), branched from the same commit
# every other recipe's uv.lock pins alpamayo-r1 to
# (4b96c546ce3416e7b1e4d86e7649662852c3c1ac), plus this recipe's patch on top.
alpamayo_r1 = { git = "https://github.com/AmirHRI/alpamayo.git", rev = "84c681632c7aa3b6a9f15b32c54ed1d9928445df" }
alpamayo-recipes = { path = "../../src", editable = true }

[tool.ruff]
line-length = 100
