# Stage 2 action-expert training on the 2B Cosmos-Reason2 backbone for Alpamayo-1.5,
# on the OFFICIAL LCDrive train split (UUID-filtered).
#
# Unlike sft_stage2_cosmos2b.yaml (which is annotation/nav driven and uses the
# 20-sample demo), this mirrors sft_stage1_cosmos2b_lcdrive.yaml: plain PAIDataset
# with the `default` vla_processor (components_order: image, traj_history, prompt,
# traj_future). LCDrive has no route/nav_text, so no annotations file is needed —
# clips are selected purely by the LCDrive manifest UUID lists.
#
# The VLM is FROZEN and loaded from the Stage-1 LCDrive checkpoint; only the action
# expert + diffusion head are trained (seeded from Alpamayo-1.5-10B's action/
# diffusion tensors). The `default` processor is inherited from sft_base (we do NOT
# override to `nav`), matching how Stage 1 was trained on LCDrive.
#
# LCDrive train = 38,340 clips, LCDrive val = 23,331 clips. Clips are interleaved
# across chunks 0-3143 (all present on disk), so we scan the full chunk range and
# restrict to the manifest UUIDs via `clip_uuid_filter`.
defaults:
  - sft_base
  - /models/cosmos_reason2_2b_expert@model
  - /wandb: default
  - _self_

model:
  # Frozen VLM initial weights come from the trained Stage-1 LCDrive checkpoint.
  stage1_vlm_checkpoint_path: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/output_stage1_cosmos2b_lcdrive/checkpoint-3597

data:
  train_dataset:
    local_dir: /data/datasets/physical_ai_av/
    chunk_ids: "0-3146"     # scan all present chunks; UUID filter does the selection
    clip_uuid_filter: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
  val_dataset:
    local_dir: /data/datasets/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_clip_uuids.txt

trainer:
  report_to: wandb
  # VLM is frozen so no gradient checkpointing or ZeRO needed — only the ~0.47B
  # action expert + diffusion head carry gradients.
  gradient_checkpointing: false
  deepspeed: null
  ddp_find_unused_parameters: true
  # VLM frozen → only the ~0.47B expert has gradients/optimizer state, so batch 4
  # used only ~30GB/80GB. Batch 10 (~63GB) uses the headroom; batch 8 was ~52GB.
  per_device_train_batch_size: 10
  gradient_accumulation_steps: 1
  # The frozen VLM forward is cheap, so training is I/O-bound on decoding 16 video
  # frames/sample. More workers + prefetch keep the GPU fed (was starving at 2).
  # 8 (not 12) to stay resilient to host-RAM/swap pressure from co-tenant jobs.
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true
  learning_rate: 1e-4
  warmup_steps: 500
  num_train_epochs: 3

paths:
  output_dir: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/output_stage2_cosmos2b_lcdrive

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_sft_stage2_cosmos2b_lcdrive
