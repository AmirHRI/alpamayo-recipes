_target_: alpamayo1_5_sft.models.sft_alpamayo_r1.TrainableAlpamayoR1.from_pretrained_vlm
vlm_name_or_path: /data/achahe/alpasim/huggingface/hub/Cosmos-Reason2-2B
alpamayo_config_path: /data/achahe/alpasim/huggingface/hub/models--nvidia--Alpamayo-1.5-10B-A1-format
# null → use the base 2B VLM (built from vlm_name_or_path) instead of a Stage-1
# fine-tuned checkpoint. Point this at output_stage1_cosmos2b/checkpoint-N once
# Stage 1 has been trained.
stage1_vlm_checkpoint_path: null
stage2_checkpoint_path: null   # set by evaluate_hf.py at eval time
cotrain_vlm: false
stop_grad_from_vlm: true

# Expert geometry mirrors Alpamayo-1.5-10B: same DEPTH as the VLM, half the WIDTH.
#
# Depth is not a size knob. HF indexes the KV cache by `layer_idx`, so expert
# layer i attends to VLM cache layer i. The previous setting (7 layers on a
# 28-layer VLM) therefore left cache layers 7-27 unread — the action head saw
# only the VLM's 7 shallowest layers. Measured by instrumenting Cache.update
# during a real Stage-2 forward:
#     7-layer expert  -> reads cache layers [0..6],  21 of 28 stranded
#     28-layer expert -> reads cache layers [0..27], 0 stranded
#     real 10B teacher-> reads cache layers [0..35], 0 stranded
#
# The 10B avoids this by omitting `num_hidden_layers` from its expert_cfg and
# shrinking width instead. Verified against the released checkpoint's own
# tensors: expert.layers.0..35 (36, no gaps), q_proj [2048,2048] (16 heads),
# k_proj [1024,2048] (8 kv-heads x 128 — identical to its VLM), 2.279 B params.
#
# Applying the same rule at 2B, and keeping the parameter budget:
#   depth      28  = VLM depth              (null → inherit)
#   hidden   1024  = 2048 / 2               (10B: 2048 = 4096 / 2)
#   inter    4128  = 6144 x 0.672           (10B: 8256 = 12288 x 0.672)
#   q_heads     8  = 16 / 2                 (10B: 16 = 32 / 2)
#   kv_heads/head_dim inherited from the VLM (8 x 128) — required for the expert
#   to consume the VLM's cache; never overridden.
# ≈ 0.47 B, vs 0.44 B for the old 7-layer expert, but reading all 28 cache layers.
expert_num_layers: null
expert_hidden_size: 1024
expert_intermediate_size: 4128
expert_num_attention_heads: 8
