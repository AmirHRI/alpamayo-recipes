# Token-trajectory evaluation of the released Alpamayo-1.5-10B on the official
# LCDrive val split — apples-to-apples with our 2B Stage-1 model.
#
# Same LCDrive val UUID filter and the base `evaluate` block (ReasoningSampler +
# DistanceMetrics, best-of-6). The model is the 10B VLM loaded token-only (no
# action expert / diffusion), so `min_ade` here is the VLM discrete-token
# trajectory quality, directly comparable to sft_stage1_cosmos2b_lcdrive.
defaults:
  - sft_base
  - /models/alpamayo_1_5_10b_token@model
  - /wandb: default
  - _self_

data:
  train_dataset:
    local_dir: /data/datasets/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
  val_dataset:
    local_dir: /data/datasets/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /data/datasets/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_clip_uuids.txt

trainer:
  report_to: wandb
  per_device_eval_batch_size: 8

paths:
  output_dir: /data/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/output_eval_10b_token_lcdrive

evaluate:
  # Model weights come from the model config's checkpoint_path
  # (from_alpamayo_checkpoint), so leave eval_ckpt null to avoid overriding it.
  eval_ckpt: null

task_name: alpamayo_1_5_eval_10b_token_lcdrive
