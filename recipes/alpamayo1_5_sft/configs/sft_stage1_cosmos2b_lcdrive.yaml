# Stage 1 VLM fine-tune of the 2B Cosmos-Reason2 backbone for Alpamayo-1.5,
# on the OFFICIAL LCDrive train split (UUID-filtered).
#
# Unlike sft_stage1_cosmos2b.yaml (which is annotation/nav driven), this uses the
# plain PAIDataset with the `default` vla_processor
# (components_order: image, traj_history, prompt, traj_future). LCDrive has no
# route/nav_text, so no annotations file is needed — clips are selected purely by
# the LCDrive manifest UUID lists.
#
# LCDrive train = 38,340 clips, LCDrive val = 23,331 clips. Clips are interleaved
# across chunks 0-3143 (all present on disk), so we scan the full chunk range and
# restrict to the manifest UUIDs via `clip_uuid_filter`.
defaults:
  - sft_base
  - /models/cosmos_reason2_2b@model
  - /wandb: default
  - _self_

data:
  train_dataset:
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"     # scan all present chunks; UUID filter does the selection
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_train_clip_uuids.txt
  val_dataset:
    local_dir: /temp/achahe/physical_ai_av/
    chunk_ids: "0-3146"
    clip_uuid_filter: /temp/achahe/physical_ai_av/lcdrive_physicalai_av_manifests/lcdrive_val_clip_uuids.txt

trainer:
  report_to: wandb
  lr_multiplier:
    vlm.model.visual: 0.1
  ddp_find_unused_parameters: false
  per_device_train_batch_size: 8   # ~62GB at bs=6 (~6GB/unit); bs=8 ≈ 74GB on 80GB
  gradient_accumulation_steps: 2   # effective batch = 8 x 2 x 3 GPUs = 48
  learning_rate: 1e-5
  warmup_steps: 500
  num_train_epochs: 3

paths:
  output_dir: /temp/achahe/alpamayo-recipes/recipes/alpamayo1_5_sft/training/output_stage1_cosmos2b_lcdrive

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_sft_stage1_cosmos2b_lcdrive
